name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  python:
    name: Build Python distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel and source distribution
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: seecoder-python-dist
          path: dist/*

  macos:
    name: Build unsigned macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build SwiftUI executable
        working-directory: desktop/swiftui
        run: swift build -c release
      - name: Assemble application bundle
        shell: bash
        run: |
          bin_dir="$(cd desktop/swiftui && swift build -c release --show-bin-path)"
          app_dir="$GITHUB_WORKSPACE/dist/SEECODERDesktop.app"
          resource_bundle="$(find "$bin_dir" -maxdepth 1 -type d -name 'SEECODERDesktop_*.bundle' -print -quit)"
          test -x "$bin_dir/SEECODERDesktop"
          test -n "$resource_bundle"
          mkdir -p "$app_dir/Contents/MacOS" "$app_dir/Contents/Resources"
          cp "$bin_dir/SEECODERDesktop" "$app_dir/Contents/MacOS/SEECODERDesktop"
          cp -R "$resource_bundle" "$app_dir/Contents/Resources/"
          cp desktop/swiftui/Resources/Info.plist "$app_dir/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$app_dir" dist/SEECODERDesktop-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: seecoder-macos-app
          path: dist/SEECODERDesktop-macos.zip

  electron:
    name: Package Electron compatibility source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          mkdir -p dist
          tar --exclude='node_modules' --exclude='dist' -czf dist/seecoder-electron-source.tar.gz desktop/electron
      - uses: actions/upload-artifact@v4
        with:
          name: seecoder-electron-source
          path: dist/seecoder-electron-source.tar.gz

  publish:
    name: Publish GitHub release
    needs: [python, macos, electron]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
