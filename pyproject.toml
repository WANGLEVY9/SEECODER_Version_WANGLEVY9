[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "seecoder"
version = "0.1.0"
description = "A small, auditable coding agent built without agent frameworks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=3.5.0,<4.0.0",
]

[project.scripts]
seecoder = "seecoder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seecoder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
